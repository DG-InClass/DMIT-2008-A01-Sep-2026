<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510"><rect width="1200" height="510" fill="#f3f7fc"/><g font-family="Arial,Helvetica,sans-serif"><text x="600" y="54" font-size="32" font-weight="bold" text-anchor="middle" fill="#102c49">How did the user navigate?</text><rect x="70" y="115" width="465" height="205" rx="22" fill="#2563eb"/><text x="302.5" y="167" fill="white" font-size="27" font-weight="bold" text-anchor="middle">Direct URL / refresh</text><text x="302.5" y="207" fill="#e8efff" font-size="20" text-anchor="middle">Server responds with page HTML</text><rect x="660" y="115" width="465" height="205" rx="22" fill="#7c3aed"/><text x="892.5" y="167" fill="white" font-size="25" font-weight="bold" text-anchor="middle">Client navigation via Link</text><text x="892.5" y="207" fill="#e8efff" font-size="20" text-anchor="middle">Next.js fetches page data</text><text x="600" y="405" font-size="27" font-weight="bold" text-anchor="middle" fill="#0f766e">getServerSideProps runs on the server in both cases.</text></g></svg>