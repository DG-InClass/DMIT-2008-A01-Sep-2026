<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510"><rect width="1200" height="510" fill="#f3f7fc"/><g font-family="Arial,Helvetica,sans-serif"><text x="600" y="54" font-size="32" font-weight="bold" text-anchor="middle" fill="#102c49">First content, then interactivity</text><rect x="35" y="135" width="335" height="185" rx="22" fill="#0f766e"/><text x="202.5" y="187" fill="white" font-size="28" font-weight="bold" text-anchor="middle">1. HTML arrives</text><text x="202.5" y="227" fill="#e8efff" font-size="20" text-anchor="middle">Product names visible</text><path d="M382 224 h96" stroke="#334155" stroke-width="7" fill="none"/><path d="M478 224 l-20 -14 v28 z" fill="#334155"/><text x="430" y="202" font-size="18" text-anchor="middle" fill="#334155"></text><rect x="502" y="135" width="295" height="185" rx="22" fill="#2563eb"/><text x="649.5" y="187" fill="white" font-size="28" font-weight="bold" text-anchor="middle">2. JS loads</text><text x="649.5" y="227" fill="#e8efff" font-size="20" text-anchor="middle">React hydrates page</text><path d="M804 224 h96" stroke="#334155" stroke-width="7" fill="none"/><path d="M900 224 l-20 -14 v28 z" fill="#334155"/><text x="852" y="202" font-size="18" text-anchor="middle" fill="#334155"></text><rect x="925" y="135" width="235" height="185" rx="22" fill="#7c3aed"/><text x="1042.5" y="187" fill="white" font-size="25" font-weight="bold" text-anchor="middle">3. Interactive</text><text x="1042.5" y="227" fill="#e8efff" font-size="20" text-anchor="middle">Clicks + state</text><text x="600" y="418" font-size="26" fill="#334155" text-anchor="middle">Hydration attaches React behavior to existing HTML.</text></g></svg>